version: "2"

sql:
  - schema: "./internal/db/migration/"
    queries: "./internal/db/query/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "./internal/db/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        overrides:
          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullTime"